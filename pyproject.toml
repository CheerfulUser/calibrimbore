[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrimbore"
dynamic = ["version"]
description = "Calibrate photometric systems to PS1, DECam, and SkyMapper."
readme = "README.md"
requires-python = ">=3.9.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ryan Ridden", email = "ryan.ridden@canterbury.ac.nz"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pysynphot",
    "extinction",
    "pandas",
    "scipy>=1.5.0",
    "astropy",
    "astroquery",
    "astro-datalab",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/CheerfulUser/calibrimbore"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["calibrimbore", "calibrimbore.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "calibrimbore.__version__.__version__"}
