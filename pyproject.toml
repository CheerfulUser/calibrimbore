[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrimbore"
dynamic = ["version"]
description = "Calibrate photometric systems to PS1, DECam, and SkyMapper."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ryan Ridden", email = "ryan.ridden@canterbury.ac.nz"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    # Latest NumPy release supported by pysynphot.
    "numpy==1.24.4",
    "matplotlib",
    "pysynphot>=2.0.0",
    # pysynphot imports pkg_resources at runtime.
    "setuptools<81",
    "extinction",
    # Catalogue helpers still use DataFrame.append.
    "pandas<2",
    "scipy>=1.5.0",
    "astropy",
    "astroquery>=0.4.11",
    # Later Data Lab releases require PyVO versions incompatible with astroquery.
    "astro-datalab>=2.22.1,<2.23",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/CheerfulUser/calibrimbore"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["calibrimbore", "calibrimbore.*"]
namespaces = false

[tool.setuptools.package-data]
calibrimbore = ["data/*.txt", "data/*.npy", "data/*/*.dat"]

[tool.setuptools.dynamic]
version = {attr = "calibrimbore.__version__.__version__"}
